---
deployment:
  tasks:
    # rogaircon.co.za is the account's PRIMARY domain, so public_html is its docroot.
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/mkdir -p $DEPLOYPATH/assets
    - /bin/cp -f *.html robots.txt sitemap.xml .htaccess $DEPLOYPATH
    - /bin/cp -Rf assets/. $DEPLOYPATH/assets/
    - /bin/rm -f $DEPLOYPATH/styles.css $DEPLOYPATH/assets/favicon.svg
